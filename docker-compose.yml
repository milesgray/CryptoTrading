services:
    timescaledb:
        image: timescale/timescaledb:latest-pg15
        container_name: crypto-trading-timescaledb
        command: postgres -c log_min_messages=error -c log_statement=none -c client_min_messages=error
        environment:
            - POSTGRES_DB=${POSTGRES_DB:-crypto_trading}
            - POSTGRES_USER=${POSTGRES_USER:-postgres}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
        ports:
            - "127.0.0.1:${TIMESCALEDB_PORT:-5432}:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data

    frontend:
        build:
            context: .
            dockerfile: Dockerfile.frontend
            target: development
        ports:
            - "${FRONTEND_PORT:-8080}:8080"
        environment:
            - VITE_BACKEND_URL=http://serve:8000
            - VITE_TRAIN_URL=http://train:8000
            - VITE_PRESSURE_URL=http://pressure:8000
        depends_on:
            - serve
            - train
            - pressure

    serve:
        build:
            context: .
            dockerfile: Dockerfile.serve
        ports:
            - "${SERVE_PORT:-8000}:8000"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        environment:
            - DB_BACKEND=${DB_BACKEND:-postgres}
            - POSTGRES_URI=${POSTGRES_URI:-postgresql://postgres:postgres@timescaledb:5432/crypto_trading}
            - RETRIEVAL_SERVICE_URL=${RETRIEVAL_SERVICE_URL:-http://retrieval:8000}
            - EMBED_SERVICE_URL=${EMBED_SERVICE_URL:-http://embed:8000}
            - PREDICT_SERVICE_URL=${PREDICT_SERVICE_URL:-http://predict:8000}
            - PRESSURE_SERVICE_URL=${PRESSURE_SERVICE_URL:-http://pressure:8000}
            - JEPA_SERVICE_URL=${JEPA_SERVICE_URL:-http://jepa:8000}
            - SENTIMENT_SERVICE_URL=${SENTIMENT_SERVICE_URL:-http://sentiment:8080}
            - TRADE_SERVICE_URL=${TRADE_SERVICE_URL:-http://trade:8000}
            - TRAIN_SERVICE_URL=${TRAIN_SERVICE_URL:-http://train:8000}
            - ARTIFACT_SERVICE_URL=${ARTIFACT_SERVICE_URL:-http://artifact:8000}
            - PORT=8000
            - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
        depends_on:
            - timescaledb
            - retrieval
            - predict
            - train
            - pressure
            - artifact
            - record
            - embed

    retrieval:
        build:
            context: .
            dockerfile: Dockerfile.retrieval
        ports:
            - "${RETRIEVAL_PORT:-8000}:8000"
        environment:
            - DB_BACKEND=${DB_BACKEND:-postgres}
            - POSTGRES_URI=${POSTGRES_URI:-postgresql://postgres:postgres@timescaledb:5432/crypto_trading}
            - EMBED_SERVICE_URL=${EMBED_SERVICE_URL:-http://embed:8000}
            - ARTIFACT_SERVICE_URL=${ARTIFACT_SERVICE_URL:-http://artifact:8000}
            - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
            - DATABASE_STATEMENT_TIMEOUT=180000
        depends_on:
            - timescaledb
            - embed
            - record

    embed:
        build:
            context: .
            dockerfile: Dockerfile.embed
        ports:
            - "${EMBED_PORT:-8000}:8000"
        volumes:
            - ./services/embed/models/trained:/app/models/trained
        environment:
            - DB_BACKEND=${DB_BACKEND:-postgres}
            - POSTGRES_URI=${POSTGRES_URI:-postgresql://postgres:postgres@timescaledb:5432/crypto_trading}
            - ARTIFACT_SERVICE_URL=${ARTIFACT_SERVICE_URL:-http://artifact:8000}
            - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
        depends_on:
            - timescaledb
            - record
    record:
        build:
            context: .
            dockerfile: Dockerfile.record
        ports:
            - "${RECORD_PORT:-8000}:8000"
        environment:
            - DB_BACKEND=${DB_BACKEND:-postgres}
            - POSTGRES_URI=${POSTGRES_URI:-postgresql://postgres:postgres@timescaledb:5432/crypto_trading}
            - MIN_VALID_FEEDS=${MIN_VALID_FEEDS:-2}
            - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
        depends_on:
            - timescaledb

    predict:
        build:
            context: .
            dockerfile: Dockerfile.predict
        ports:
            - "${PREDICT_PORT:-8000}:8000"
        environment:
            - DB_BACKEND=${DB_BACKEND:-postgres}
            - POSTGRES_URI=${POSTGRES_URI:-postgresql://postgres:postgres@timescaledb:5432/crypto_trading}
            - ARTIFACT_SERVICE_URL=${ARTIFACT_SERVICE_URL:-http://artifact:8000}
            - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
        depends_on:
            - timescaledb
            - record

    train:
        build:
            context: .
            dockerfile: Dockerfile.train
        ports:
            - "${TRAIN_PORT:-8389}:8000"
        environment:
            - DB_BACKEND=${DB_BACKEND:-postgres}
            - POSTGRES_URI=${POSTGRES_URI:-postgresql://postgres:postgres@timescaledb:5432/crypto_trading}
            - ARTIFACT_SERVICE_URL=${ARTIFACT_SERVICE_URL:-http://artifact:8000}
            - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
        depends_on:
            - timescaledb
            - record

    pressure:
        build:
            context: .
            dockerfile: Dockerfile.pressure
        ports:
            - "${PRESSURE_PORT:-8000}:8000"
        environment:
            - DB_BACKEND=${DB_BACKEND:-postgres}
            - POSTGRES_URI=${POSTGRES_URI:-postgresql://postgres:postgres@timescaledb:5432/crypto_trading}
            - ARTIFACT_SERVICE_URL=${ARTIFACT_SERVICE_URL:-http://artifact:8000}
            - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
        depends_on:
            - timescaledb
            - record

    artifact:
        build:
            context: .
            dockerfile: Dockerfile.artifact
        ports:
            - "${ARTIFACT_PORT:-8000}:8000"
        volumes:
            - ./checkpoints:/app/checkpoints
        environment:
            - ARTIFACT_STORAGE_DIR=/app/checkpoints
            - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}

    portainer:
        image: portainer/portainer-ce:latest
        container_name: crypto-trading-portainer
        restart: always
        ports:
            - "9443:9443"
            - "9000:9000"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - portainer_data:/data

volumes:
    pgdata:
    portainer_data:
