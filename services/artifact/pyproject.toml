[project]
name = "cryptotrading-artifact"
version = "0.1.0"
description = "FastAPI service for storing, retrieving, listing, and managing model artifacts and system files"
authors = [
    { name = "Miles", email = "miles@resatiate.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.11",
    "uvicorn>=0.51.0",
    "python-multipart>=0.0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false