[project]
name = "cryptotrading-sentiment"
version = "0.1.0"
description = "web server for sentiment service"
authors = [
    { name = "Miles", email = "miles@resatiate.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pytz>=2024",
    "pymongo>=4.11.2",
    "motor>=3.7.0",
    "asyncio>=3.4.3",
    "six>=1.17.0",
    "numpy>=2.2.3",
    "fastapi[standard]>=0.115.11",
    "cryptotrading>=0.1.0",
    "twipy>=0.0.10",
    "textblob>=0.20.1",
    "vadersentiment>=3.3.2",
    "pandas>=3.0.5",
    "numba>=0.66.0",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "schedule>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.uv.sources]
cryptotrading = { path = "../../src", editable = true }
